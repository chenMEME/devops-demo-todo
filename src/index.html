<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://lkkijxzbalhnpvqnljye.supabase.co; connect-src https://lkkijxzbalhnpvqnljye.supabase.co; img-src 'self' data: https://lkkijxzbalhnpvqnljye.supabase.co; style-src 'self' 'unsafe-inline'; font-src 'self'">
  <title>📋 待办事项</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Microsoft YaHei',-apple-system,sans-serif;background:#f0f2f5;display:flex;justify-content:center;padding:0;min-height:100vh;user-select:none;overflow:hidden}
    .window{width:100%;height:100vh;background:#fff;display:flex;flex-direction:column}
    .titlebar{padding:14px 18px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;gap:10px;-webkit-app-region:drag}
    .titlebar .icon{font-size:20px}.titlebar h1{font-size:1.1rem;font-weight:600;color:#1a1a2e;flex:1}
    .controls{display:flex;gap:4px}
    .controls button{width:28px;height:28px;border:none;border-radius:6px;cursor:pointer;font-size:.75rem;background:transparent;color:#aaa;transition:all .12s}
    .controls button:hover{background:#f0f0f0;color:#333}
    .filters{display:flex;gap:6px;padding:10px 18px;border-bottom:1px solid #f0f0f0}
    .filter-tag{padding:4px 14px;border-radius:20px;font-size:.78rem;cursor:pointer;border:1.5px solid #e0e0e0;background:#fff;color:#666;transition:all .15s;font-weight:500}
    .filter-tag:hover,.filter-tag.active{background:#667eea;color:#fff;border-color:#667eea}
    .input-area{padding:12px 18px;border-bottom:1px solid #f5f5f5}
    .input-row{display:flex;gap:6px}
    .input-row input[type=text]{flex:1;padding:9px 12px;border:2px solid #e8e8e8;border-radius:8px;font-size:.88rem;outline:none;font-family:inherit}
    .input-row input[type=text]:focus{border-color:#667eea}
    .input-row button{padding:9px 16px;background:#667eea;color:#fff;border:none;border-radius:8px;font-size:.88rem;cursor:pointer;font-weight:600;font-family:inherit;transition:background .15s}
    .input-row button:hover{background:#5a6fd6}
    .input-extra{display:flex;gap:8px;margin-top:7px;align-items:center}
    .input-extra select,.input-extra input[type=date]{padding:5px 8px;border:1.5px solid #e8e8e8;border-radius:6px;font-size:.78rem;outline:none;color:#555;font-family:inherit}
    .input-extra select:focus,.input-extra input[type=date]:focus{border-color:#667eea}
    .todo-list{flex:1;overflow-y:auto;padding:6px 18px 20px}
    .todo-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;margin-bottom:3px;transition:background .15s}
    .todo-item:hover{background:#f8f9ff}
    .todo-item.completed .todo-text{text-decoration:line-through;color:#ccc}
    .todo-check{width:18px;height:18px;cursor:pointer;accent-color:#667eea;flex-shrink:0}
    .todo-text{flex:1;font-size:.88rem;color:#333;line-height:1.4;word-break:break-word}
    .todo-cat{font-size:.7rem;padding:2px 8px;border-radius:10px;font-weight:500;flex-shrink:0}
    .cat-工作{background:#e8f0fe;color:#1967d2}.cat-个人{background:#fce8e6;color:#c5221f}
    .cat-学习{background:#e6f4ea;color:#137333}.cat-其他{background:#f3e8fd;color:#7b1fa2}
    .todo-date{font-size:.73rem;color:#999;flex-shrink:0;white-space:nowrap}
    .todo-date.overdue{color:#e53e3e;font-weight:600}
    .todo-actions{display:flex;gap:2px;flex-shrink:0}
    .todo-actions button{width:26px;height:26px;border:none;border-radius:6px;cursor:pointer;font-size:.73rem;background:transparent;color:#999;transition:all .12s;display:flex;align-items:center;justify-content:center}
    .todo-actions button:hover{background:#f0f0f0;color:#333}
    .todo-actions .btn-del:hover{background:#fee;color:#e53e3e}
    .empty{text-align:center;color:#ccc;padding:3rem 0}
    .empty .icon{font-size:2.2rem;display:block;margin-bottom:.4rem}
    .statusbar{padding:10px 18px;border-top:1px solid #f0f0f0;display:flex;justify-content:space-between;font-size:.75rem;color:#aaa;background:#fff}
    .sync-dot{color:#4caf50}.sync-dot.offline{color:#e0e0e0}
  </style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <span class="icon">📋</span><h1>待办事项</h1>
      <div class="controls">
        <button onclick="window.deleteCompleted()" title="清除已完成">🗑</button>
        <button onclick="window.exportTodos()" title="导出数据">📥</button>
      </div>
    </div>
    <div class="filters">
      <span class="filter-tag active" data-cat="">全部</span>
      <span class="filter-tag" data-cat="工作">💼 工作</span>
      <span class="filter-tag" data-cat="个人">👤 个人</span>
      <span class="filter-tag" data-cat="学习">📚 学习</span>
    </div>
    <div class="input-area">
      <div class="input-row">
        <input type="text" id="todoInput" placeholder="🔍 搜索或添加新任务..." maxlength="200" autofocus>
        <button id="addBtn">添加</button>
      </div>
      <div class="input-extra">
        <select id="catSelect">
          <option value="">📂 分类</option>
          <option value="工作">💼 工作</option>
          <option value="个人">👤 个人</option>
          <option value="学习">📚 学习</option>
          <option value="其他">📌 其他</option>
        </select>
        <input type="date" id="dueInput" title="截止日期">
      </div>
    </div>
    <ul class="todo-list" id="todoList"></ul>
    <div class="empty" id="empty" style="display:none"><span class="icon">✨</span><p>暂无待办事项</p></div>
    <div class="statusbar"><span id="stats"></span><span id="syncStatus"><span class="sync-dot">●</span> 已同步</span></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>window.setupApp();</script>
</body>
</html>
